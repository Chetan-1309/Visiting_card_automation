{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-card">
  <h2>Welcome Back</h2>
  <p class="auth-sub">Login to your account</p>

  <form method="post">
    {% csrf_token %}
    {% for field in form %}
      <div class="form-group">
        <label>{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <span class="field-error">{{ field.errors.0 }}</span>
        {% endif %}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn-primary btn-full">Login</button>
  </form>

  <p class="auth-link">No account? <a href="{% url 'register' %}">Register here</a></p>
</div>
{% endblock %}
